name: Build Kernel
permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      target_devices:
        description: 'target device (目标设备)'
        required: true
        type: choice
        options:
          - 'umi'
          - 'cmi'
          - 'cas'
          - 'thyme'
          - 'munch'
          - 'dagu'
          - 'elish'
          - 'enuma'
          - 'alioth'
          - 'apollo'
          - 'lmi'
          - 'psyche'
          - 'pipa'
          - 'all'
      compiled_system:
        description: 'Applicable systems (适用系统)'
        required: true
        type: choice
        default: 'MIUI'
        options:
          - 'MIUI'
          - 'AOSP'
      kernelsu_variant:
        description: 'KernelSU variant (KernelSU 版本) — 一次只填一个;要测两个就分两次 Run workflow'
        required: true
        type: string
        default: 'SukiSU-Ultra'
      kpm_enable:
        description: 'Is KPM support enabled? (是否启用 KPM 支持?)'
        required: true
        type: choice
        default: 'enable'
        options:
          - 'enable'
          - 'disable'
      kernel_version:
        description: 'Customizing the kernel version number (自定义内核版本号)'
        required: false
        type: string
        default: ''
      build_type:
        description: 'Kernel Build Type (内核构建类型)'
        required: true
        type: choice
        default: 'Release'
        options:
          - 'Release'
          - 'Dev'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          DEVICES="${{ github.event.inputs.target_devices }}"
          if [ "$DEVICES" == "all" ]; then
            DEVICES="umi,cmi,cas,thyme,munch,dagu,elish,enuma,alioth,apollo,lmi,psyche,pipa"
          fi
          DEVICES_JSON="[$(echo $DEVICES | sed 's/,/","/g' | sed 's/.*/"&"/')]"
          echo "matrix={\"device\":$DEVICES_JSON}" >> $GITHUB_OUTPUT
          echo "devices: $DEVICES_JSON"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    strategy:
      matrix: ${{fromJson(needs.prepare.outputs.matrix)}}
      fail-fast: false
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      WORKDIR: "${{ github.workspace }}"
      KERNEL_SOURCE: "${{ github.workspace }}/kernel_source"
      TOOLCHAIN_DIR: "${{ github.workspace }}/toolchain"
      DEVICE: "${{ matrix.device }}"

    steps:
      - name: 📢 Build Information (构建信息)
        run: |
          echo "设备: ${DEVICE} | 系统: ${{ github.event.inputs.compiled_system }}"
          echo "KernelSU变体: ${{ github.event.inputs.kernelsu_variant }} | KPM: ${{ github.event.inputs.kpm_enable }}"
          echo "构建类型: ${{ github.event.inputs.build_type }}"

      - name: 🚀 Maximize build space (最大化构建空间)
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 16384
          temp-reserve-mb: 2048
          swap-size-mb: 1024
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"

      - name: Disk usage after space maximization
        run: df -h / /mnt "${{ github.workspace }}" || true

      - name: 📦 Installation of dependencies (安装依赖)
        run: |
          echo "正在安装构建依赖..."
          sudo apt update && sudo apt upgrade -y
          sudo apt install -y \
            bc binutils-dev bison build-essential ca-certificates ccache cmake curl file flex \
            git libelf-dev libssl-dev make ninja-build python3-dev texinfo u-boot-tools xz-utils \
            zlib1g-dev libncurses-dev wget zip cpio python3 python3-pip tree gcc clang lld llvm jq
          echo "✅ Dependency installation complete (依赖安装完成)"
          
      - name: ⚙️ Configuring ccache (配置 ccache)
        run: |
          mkdir -p ~/.cache
          ccache --version
          ccache --max-size=2G
          ccache --set-config=compression=true
          ccache --zero-stats
          echo "CCACHE_DIR=${{ github.workspace }}/.ccache" >> $GITHUB_ENV
          
      - name: 📥 Restore ccache (恢复 ccache 缓存)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ github.event.inputs.compiled_system }}-${{ hashFiles('**/Makefile') }}
          restore-keys: |
            ccache-${{ github.event.inputs.compiled_system }}-
            ccache-
            
      - name: 📥 Cloning kernel source code （克隆内核源码）
        run: |
          echo "正在克隆内核源码..."
          git clone https://github.com/dilingstar/kernel_xiaomi_sm8250_mod.git --depth=1 $KERNEL_SOURCE
          echo "✅ Kernel source code cloning complete (内核源码克隆完成)"

      - name: 📥 Caching toolchain (缓存工具链)
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ${{ env.TOOLCHAIN_DIR }}
          key: toolchain-clang-r547379-gcc-${{ hashFiles('**/*.sh') }}
          restore-keys: |
            toolchain-clang-r547379-gcc-
            toolchain-
            
      - name: 📥 Download the compilation toolchain (下载编译工具链)
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          echo "正在下载编译工具链..."
          # 创建工具链目录
          mkdir -p "$TOOLCHAIN_DIR/clang"
          mkdir -p "$TOOLCHAIN_DIR/gcc/gcc64"
          mkdir -p "$TOOLCHAIN_DIR/gcc/gcc32"
          
          # 下载 Clang
          echo "正在下载 Clang..."
          cd "$TOOLCHAIN_DIR/clang"
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz -O clang-r547379.tar.gz
          tar -xzf clang-r547379.tar.gz
          rm clang-r547379.tar.gz
          
          # 下载 GCC
          echo "正在下载 GCC工具链..."
          cd "$TOOLCHAIN_DIR/gcc/gcc64"
          git init
          git remote add origin https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git
          git fetch --depth 1 origin
          git checkout FETCH_HEAD
          
          cd "$TOOLCHAIN_DIR/gcc/gcc32"
          git init
          git remote add origin https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git
          git fetch --depth 1 origin
          git checkout FETCH_HEAD
          
          echo "✅ Toolchain download complete (工具链下载完成)"

      - name: ⚙️ Configuring KernelSU (配置 KernelSU)
        run: |
          cd "$KERNEL_SOURCE"
          
          KSU_VARIANT="${{ github.event.inputs.kernelsu_variant }}"
          
          echo "⚙️ Configure KernelSU Variants: $KSU_VARIANT (配置 KernelSU 变体: $KSU_VARIANT)"
          
          if [ "$KSU_VARIANT" == "SukiSU-Ultra" ]; then
            # Pinned to SukiSU-Ultra v3.1.8 (commit b8b7534). Do NOT go back to
            # setup.sh: it checks out "the latest tag" via git describe, which left
            # the tree in a mismatched state and produced undeclared-identifier
            # errors (ksu_manager_cmd / KSU_FEATURE_SELINUX_HIDE / KSU_IOCTL_KPM).
            # v3.1.8 is the flat legacy layout that the SUSFS 4.19 patches target,
            # and its Kconfig has no >=5.10-only feature ids.
            KSU_SHA="b8b75349e01d2cfa00496b72795bb185b9c2ae4b"
            rm -rf /tmp/ksu
            git clone --filter=blob:none --no-checkout https://github.com/SukiSU-Ultra/SukiSU-Ultra /tmp/ksu
            git -C /tmp/ksu checkout "$KSU_SHA"
            echo "SukiSU-Ultra pinned at $(git -C /tmp/ksu rev-parse --short HEAD)"
            ln -sfn /tmp/ksu/kernel "$KERNEL_SOURCE/drivers/kernelsu"
            grep -q 'drivers/kernelsu/Kconfig' "$KERNEL_SOURCE/drivers/Kconfig" || \
              sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' "$KERNEL_SOURCE/drivers/Kconfig"
            grep -q 'kernelsu' "$KERNEL_SOURCE/drivers/Makefile" || \
              printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> "$KERNEL_SOURCE/drivers/Makefile"
            echo "symlink: $(readlink "$KERNEL_SOURCE/drivers/kernelsu")"
            ls "$KERNEL_SOURCE/drivers/kernelsu" | head -5
          elif [ "$KSU_VARIANT" == "RKSU" ]; then
            # Branch pinned explicitly: susfs-v1.5.5 is gone (404) and
            # deprecated/susfs-* are abandoned upstream. Only susfs-rksu-master is live.
            RKSU_SHA="9b28326af4145974560122644e87fc9a021a2cce"
            rm -rf /tmp/ksu
            git clone --filter=blob:none --no-checkout https://github.com/rsuntk/KernelSU /tmp/ksu
            git -C /tmp/ksu fetch --depth=1 origin "$RKSU_SHA"
            git -C /tmp/ksu checkout "$RKSU_SHA"
            echo "RKSU pinned at $(git -C /tmp/ksu rev-parse --short HEAD)"
            ln -sfn /tmp/ksu/kernel "$KERNEL_SOURCE/drivers/kernelsu"
            grep -q 'drivers/kernelsu/Kconfig' "$KERNEL_SOURCE/drivers/Kconfig" || \
              sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' "$KERNEL_SOURCE/drivers/Kconfig"
            grep -q 'kernelsu' "$KERNEL_SOURCE/drivers/Makefile" || \
              printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> "$KERNEL_SOURCE/drivers/Makefile"
          elif [ "$KSU_VARIANT" == "KernelSU" ]; then
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5
          else
            echo "KernelSU Disabled (KernelSU 已禁用)"
          fi
          
          echo "✅ KernelSU configuration complete (KernelSU 配置完成)"
          
      - name: 🌿 Integrating SUSFS kernel patches (集成 SUSFS 内核补丁)
        run: |
          cd "$KERNEL_SOURCE"
          KSU_VARIANT="${{ github.event.inputs.kernelsu_variant }}"

          if [ "$KSU_VARIANT" != "SukiSU-Ultra" ] && [ "$KSU_VARIANT" != "RKSU" ]; then
            echo "Skipped: SUSFS integration is only wired for SukiSU-Ultra / RKSU."
            exit 0
          fi

          # KernelSU PR 191 forces userspace to map user data as rw, and group 4
          # then shares it read-only. SUSFS requires this revert.
          echo "--- reverting KernelSU PR 191 (898e9d4f) ---"
          git -C /tmp/ksu revert --no-edit 898e9d4f8ca9b2f46b0c6b36b80a872b5b88d899 || \
            echo "NOTE: revert did not apply cleanly - continuing, verify later if su misbehaves"

          echo "--- cloning susfs4ksu branch kernel-4.19 ---"
          rm -rf /tmp/susfs4ksu
          git clone --depth=1 -b kernel-4.19 https://gitlab.com/simonpunk/susfs4ksu /tmp/susfs4ksu
          ls /tmp/susfs4ksu/kernel_patches

          # Copy the shipped fs/ and include/ sources BEFORE patching, because
          # 50_add_susfs_in_kernel only wires up existing files.
          cp -v /tmp/susfs4ksu/kernel_patches/fs/susfs.c "$KERNEL_SOURCE/fs/susfs.c"
          cp -v /tmp/susfs4ksu/kernel_patches/include/linux/susfs.h "$KERNEL_SOURCE/include/linux/susfs.h"
          echo "SUSFS_VERSION: $(grep -m1 SUSFS_VERSION "$KERNEL_SOURCE/include/linux/susfs.h" || echo unknown)"

          # 50_... is applied from the kernel root with -p1, so the patch file has
          # to sit here first.
          cp -v /tmp/susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch "$KERNEL_SOURCE/"
          cp -v /tmp/susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch /tmp/ksu/

          echo "--- applying 10_enable_susfs_for_ksu.patch (KernelSU side) ---"
          if grep -q 'susfs' /tmp/ksu/kernel/Makefile 2>/dev/null; then
            echo "already applied - skipping"
          elif ( cd /tmp/ksu && patch -p1 --forward --fuzz=0 < 10_enable_susfs_for_ksu.patch ); then
            echo "KernelSU SUSFS patch applied"
          else
            echo "ERROR: 10_enable_susfs_for_ksu.patch failed against SukiSU v3.1.8."
            echo "--- hunks ---"
            grep -n -m 40 '^@@' /tmp/ksu/10_enable_susfs_for_ksu.patch
            ( cd /tmp/ksu && patch -p1 --forward --fuzz=0 --dry-run < 10_enable_susfs_for_ksu.patch 2>&1 | head -40 ) || true
            exit 1
          fi

          echo "--- applying 50_add_susfs_in_kernel-4.19.patch (kernel side) ---"
          if grep -q 'susfs_start_sdcard_monitor_fn' fs/namespace.c 2>/dev/null; then
            echo "already applied - skipping"
          elif patch -p1 --forward --fuzz=0 < 50_add_susfs_in_kernel-4.19.patch; then
            echo "kernel SUSFS patch applied"
          else
            echo "ERROR: 50_add_susfs_in_kernel-4.19.patch failed. Failed hunks:"
            find . -name '*.rej' -not -path './out/*' | head -20
            echo "--- hunks ---"
            grep -n -m 60 '^@@' 50_add_susfs_in_kernel-4.19.patch
            ( patch -p1 --forward --fuzz=0 --dry-run < 50_add_susfs_in_kernel-4.19.patch 2>&1 | head -40 ) || true
            exit 1
          fi

          echo "--- SUSFS landing check ---"
          grep -q 'SUSFS_VERSION' include/linux/susfs.h && echo "  OK: include/linux/susfs.h"
          grep -q 'susfs_start_sdcard_monitor_fn' fs/namespace.c && echo "  OK: fs/namespace.c hook"
          grep -q 'susfs' fs/Makefile && echo "  OK: fs/Makefile entry"

      - name: 🪝 Applying KernelSU manual hooks patch (应用 KernelSU 手动 Hook 补丁)
        run: |
          cd "$KERNEL_SOURCE"
          KSU_VARIANT="${{ github.event.inputs.kernelsu_variant }}"

          if [ "$KSU_VARIANT" != "SukiSU-Ultra" ] && [ "$KSU_VARIANT" != "RKSU" ]; then
            echo "Skipped: hook patch is only needed for SukiSU-Ultra / RKSU."
            exit 0
          fi

          # 'builtin' only ships drivers/kernelsu/. Its hook call sites
          # (execveat / faccessat / stat / read / input / devpts) must be added to
          # the core kernel source. Without them the kernel fails to link with
          # undefined references to ksu_handle_execveat / _stat / _faccessat.
          # Path '4.19/' is hard-coded: apollo is 4.19.325.
          PATCH_URL="https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/main/4.19/ksu_hooks_sukisu_4.19.patch"
          curl -LSs "$PATCH_URL" -o /tmp/ksu_hooks_419.patch
          echo "patch size: $(wc -c < /tmp/ksu_hooks_419.patch) bytes"
          if [ ! -s /tmp/ksu_hooks_419.patch ]; then
            echo "ERROR: hooks patch download failed or empty: $PATCH_URL"
            exit 1
          fi

          # Bail out before the 10-minute build if the call sites are missing.
          # --fuzz=0 matters: the default fuzzy matching produced a false
          # "already applied" positive and made this step a no-op.
          if grep -q 'ksu_handle_execveat' fs/exec.c; then
            echo "Hooks already present in fs/exec.c - skipping apply."
          elif patch -p1 --forward --dry-run --fuzz=0 < /tmp/ksu_hooks_419.patch; then
            patch -p1 --forward --fuzz=0 < /tmp/ksu_hooks_419.patch
            echo "KernelSU manual hooks patch applied"
          else
            echo "ERROR: hooks patch does not apply cleanly to this tree."
            echo "--- first hunks ---"
            grep -n -m 40 '^@@' /tmp/ksu_hooks_419.patch
            echo "--- patch --dry-run output ---"
            patch -p1 --forward --dry-run --fuzz=0 < /tmp/ksu_hooks_419.patch 2>&1 | head -40
            exit 1
          fi

          echo "--- hook call sites now present in fs/ ---"
          for pair in "ksu_handle_execveat:fs/exec.c" "ksu_handle_stat:fs/stat.c" "ksu_handle_faccessat:fs/open.c"; do
            symbol="${pair%%:*}"
            file="${pair##*:}"
            if grep -q "$symbol" "$file"; then
              echo "  OK: $symbol in $file"
            else
              echo "  FAIL: $symbol NOT in $file"
              exit 1
            fi
          done
          echo "Manual hook verification passed"

      - name: 🔨 Build the kernel (构建内核)
        run: |
          cd "$KERNEL_SOURCE"
          
          # 设置环境变量
          export PATH="$TOOLCHAIN_DIR/clang/bin:$PATH"
          
          # 定义构建参数
          MAKE_ARGS="ARCH=arm64 SUBARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=$TOOLCHAIN_DIR/gcc/gcc64/bin/aarch64-linux-android- \
            CROSS_COMPILE_COMPAT=$TOOLCHAIN_DIR/gcc/gcc32/bin/arm-linux-androideabi- \
            CROSS_COMPILE_ARM32=$TOOLCHAIN_DIR/gcc/gcc32/bin/arm-linux-androideabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LD=ld.lld HOSTLD=ld.lld \
            KCFLAGS=-Wno-error \
            O=out"
          
          # 获取参数
          SYSTEM="${{ github.event.inputs.compiled_system }}"
          KSU="${{ github.event.inputs.kernelsu_variant }}"
          KPM="${{ github.event.inputs.kpm_enable }}"
          VERSION="${{ github.event.inputs.kernel_version }}"
          
          # 生成设备配置
          echo "🔧 Generating ${DEVICE} configuration... (正在生成 ${DEVICE} 的配置)"
          make $MAKE_ARGS -j$(nproc --all) ${DEVICE}_defconfig
          
          # 开启一些附加优化配置
          echo "🔧 Applying basic optimized configurations... (应用基本优化配置)"
          scripts/config --file out/.config \
            -e KALLSYMS \
            -e KALLSYMS_ALL \
            -e KPROBES \
            -e HAVE_KPROBES \
            -e KPROBE_EVENTS \
            -e TMPFS_XATTR=y \
            -e TMPFS_POSIX_ACL \
            -e IP_NF_TARGET_TTL \
            -e IP6_NF_TARGET_HL \
            -e IP6_NF_MATCH_HL \
            -e UCLAMP_TASK \
            -e TCP_CONG_ADVANCED \
            -e TCP_CONG_BIC \
            -e TCP_CONG_CUBIC \
            -e TCP_CONG_WESTWOOD \
            -e TCP_CONG_HTCP \
            -e TCP_CONG_HSTCP \
            -e TCP_CONG_HYBLA \
            -e TCP_CONG_VEGAS \
            -e TCP_CONG_NV \
            -e TCP_CONG_SCALABLE \
            -e TCP_CONG_LP \
            -e TCP_CONG_VENO \
            -e TCP_CONG_YEAH \
            -e TCP_CONG_ILLINOIS \
            -e TCP_CONG_DCTCP \
            -e TCP_CONG_CDG \
            -e TCP_CONG_BBR \
            -e DEFAULT_BBR \
            -e NET_SCHED \
            -e NET_SCH_HTB \
            -e NET_SCH_HFSC \
            -e NET_SCH_PRIO \
            -e NET_SCH_MULTIQ \
            -e NET_SCH_RED \
            -e NET_SCH_SFB \
            -e NET_SCH_SFQ \
            -e NET_SCH_TEQL \
            -e NET_SCH_TBF \
            -e NET_SCH_CBS \
            -e NET_SCH_ETF \
            -e NET_SCH_TAPRIO \
            -e NET_SCH_GRED \
            -e NET_SCH_NETEM \
            -e NET_SCH_DRR \
            -e NET_SCH_MQPRIO \
            -e NET_SCH_SKBPRIO \
            -e NET_SCH_CHOKE \
            -e NET_SCH_QFQ \
            -e NET_SCH_CODEL \
            -e NET_SCH_FQ_CODEL \
            -e NET_SCH_CAKE \
            -e NET_SCH_FQ \
            -e NET_SCH_HHF \
            -e NET_SCH_PIE \
            -e NET_SCH_FQ_PIE \
            -e NET_SCH_INGRESS \
            -e NET_SCH_PLUG \
            -e NET_SCH_ETS \
            -e NET_SCH_FIFO \
            -e NET_SCH_DEFAULT \
            -e DEFAULT_FQ \
            -e MQ_IOSCHED_DEADLINE \
            -e MQ_IOSCHED_KYBER \
            -e IOSCHED_BFQ \
            -e BFQ_GROUP_IOSCHED \
            -e ENERGY_MODEL \
            -e CPU_IDLE \
            -e CPU_IDLE_GOV_MENU \
            -e CPU_IDLE_GOV_TEO \
            -e ARM_PSCI_CPUIDLE \
            -e CPU_FREQ \
            -e CPU_FREQ_STAT \
            -e CPU_FREQ_TIMES \
            -e CPU_FREQ_GOV_POWERSAVE \
            -e CPU_FREQ_GOV_CONSERVATIVE \
            -e CPU_FREQ_GOV_USERSPACE \
            -e CPU_FREQ_GOV_ONDEMAND \
            -e ZRAM \
            -e ZSMALLOC \
            -e ZRAM_WRITEBACK \
            -e CRYPTO_LZ4 \
            -e CRYPTO_LZ4HC \
            -e CRYPTO_LZ4K \
            -e CRYPTO_LZ4KD \
            -e CRYPTO_ZSTD \
            -e CRYPTO_842 \
            -e CRYPTO_LZO \
            -e CRYPTO_DEFLATE \
            -e ZRAM_DEF_COMP_LZ4KD \
            -e SWAP \
            -e ZSWAP \
            -e ANDROID_SIMPLE_LMK \
            -e CPU_FREQ_GOV_SCHEDHORIZON \
            -e CPU_FREQ_DEFAULT_GOV_SCHEDHORIZON \
            --set-val LITTLE_CPU_MASK 15 \
            --set-val BIG_CPU_MASK 112 \
            --set-val PRIME_CPU_MASK 128 \
            -e LRU_GEN \
            -e LRU_GEN_ENABLED
            
          # 根据系统类型修改配置
          if [ "$SYSTEM" == "MIUI" ]; then
              echo "🔧 Apply MIUI specific configurations... (应用 MIUI 特定配置)"
              scripts/config --file out/.config \
                  --set-str STATIC_USERMODEHELPER_PATH /system/bin/micd \
                  -e PERF_CRITICAL_RT_TASK \
                  -e SF_BINDER \
                  -e OVERLAY_FS \
                  -d DEBUG_FS \
                  -e MIGT \
                  -e MIGT_ENERGY_MODEL \
                  -e MIHW \
                  -e PACKAGE_RUNTIME_INFO \
                  -e BINDER_OPT \
                  -e KPERFEVENTS \
                  -e MILLET \
                  -e PERF_HUMANTASK \
                  -d LTO_CLANG \
                  -d LOCALVERSION_AUTO \
                  -e SF_BINDER \
                  -e XIAOMI_MIUI \
                  -d MI_MEMORY_SYSFS \
                  -e TASK_DELAY_ACCT \
                  -e MIUI_ZRAM_MEMORY_TRACKING \
                  -d CONFIG_MODULE_SIG_SHA512 \
                  -d CONFIG_MODULE_SIG_HASH \
                  -e MI_FRAGMENTION \
                  -e PERF_HELPER \
                  -e BOOTUP_RECLAIM \
                  -e MI_RECLAIM \
                  -e RTMM
          fi
            
          # 根据 KernelSU 变体修改配置
          if [ "$KSU" == "SukiSU-Ultra" ] || [ "$KSU" == "RKSU" ]; then
              echo "🔧 Applying SukiSU-Ultra & RKSU Configuration... (应用 SukiSU-Ultra & RKSU 配置)"
              scripts/config --file out/.config \
                  -e KSU \
                  -e KSU_SUSFS \
                  -e KSU_SUSFS_SUS_PATH \
                  -e KSU_SUSFS_SUS_MOUNT \
                  -e KSU_SUSFS_SUS_KSTAT \
                  -e KSU_SUSFS_SPOOF_UNAME \
                  -e KSU_SUSFS_ENABLE_LOG \
                  -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
                  -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
                  -e KSU_SUSFS_OPEN_REDIRECT \
                  -e KSU_SUSFS_SUS_MAP
              # NOTE: the KSU_SUSFS_* symbols only exist AFTER
              #       50_add_susfs_in_kernel-4.19.patch has been applied (that patch
              #       injects them into drivers/kernelsu/Kconfig). scripts/config
              #       silently ignores symbols that do not exist, so entries that
              #       the 4.19 SUSFS patch does not define are harmless here.
              #       KSU itself (SukiSU v3.1.8 Kconfig) depends on OVERLAY_FS and
              #       has KSU_KPROBES_HOOK / KSU_MANUAL_HOOK / KSU_TRACEPOINT_HOOK as
              #       a choice; manual hooks are selected by the hooks patch step.
          elif [ "$KSU" == "KernelSU" ]; then
              echo "🔧 Applying KernelSU Configuration... (应用 KernelSU 配置)"
              scripts/config --file out/.config \
                  -e KSU
          fi
            
          # 判断KPM是否启用并开启相关配置
          if [ "$KSU" == "SukiSU-Ultra" ] && [ "$KPM" == "enable" ]; then
              echo "🔧 Enabling KPM Configuration... (开启 KPM 配置)"
              scripts/config --file out/.config \
                  -e KPM
          fi
            
          # 修改内核版本号
          if [ ! -z "$VERSION" ]; then
              echo "🔧 设置自定义内核版本: $VERSION"
              sed -i "s/-dirty/-$VERSION/g" scripts/setlocalversion
          else
              echo "🔧 使用默认版本后缀: -Yun"
              sed -i "s/-dirty/-Yun/g" scripts/setlocalversion
          fi

          FULL_VERSION="$VERSION"
          if [ ! -z "$FULL_VERSION" ]; then
            main_version=$(echo "$FULL_VERSION" | grep -oE '^[0-9]+(\.[0-9]+)*')
            custom_part=$(echo "$FULL_VERSION" | grep -oE '(-[a-zA-Z0-9]+)*$')
            makefile_path="$KERNEL_SOURCE/Makefile"
            IFS='.' read -ra version_parts <<< "$main_version"
            sed -i "2s/.*/VERSION = ${version_parts[0]}/" "$makefile_path"
            if [ -n "${version_parts[1]}" ]; then
              sed -i "3s/.*/PATCHLEVEL = ${version_parts[1]}/" "$makefile_path"
            fi
            if [ -n "${version_parts[2]}" ]; then
              sed -i "4s/.*/SUBLEVEL = ${version_parts[2]}/" "$makefile_path"
            fi

            sed -i "s/echo \"\$res\"/echo \"${custom_part}\"/g" "$KERNEL_SOURCE/scripts/setlocalversion"
          fi
            
          # 校验 SukiSU/SUSFS 是否真的进了最终 .config(避免刷完才发现没 root)
          echo "🔎 Verifying SukiSU / SUSFS landed in out/.config ..."
          CONFIG_FILE="$KERNEL_SOURCE/out/.config"
          [ -f "$CONFIG_FILE" ] || { echo "❌ out/.config not found: $CONFIG_FILE"; exit 1; }

          for sym in KSU KSU_SUSFS KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG KPROBES EXT4_FS; do
            if grep -qE "^CONFIG_${sym}=y" "$CONFIG_FILE"; then
              echo "  ✅ CONFIG_${sym}=y"
            else
              echo "  ❌ CONFIG_${sym} is NOT y:"
              grep -E "CONFIG_${sym}([= ]| is not set)" "$CONFIG_FILE" || echo "     (symbol absent from .config)"
              exit 1
            fi
          done

          if [ ! -d "$KERNEL_SOURCE/drivers/kernelsu" ]; then
            echo "❌ KernelSU sources missing: $KERNEL_SOURCE/drivers/kernelsu not found"
            exit 1
          fi
          echo "✅ KernelSU/SUSFS config verification passed"

          # 开始构建
          echo "🚀 Start building the kernel... (开始构建内核)"
          # Keep stderr in its own file: the kernel writes the actual error there,
          # and "2>&1 | tee" buries it somewhere in the middle of the log (that is
          # why a previous run looked like a bare "Error 2" with no cause).
          set +e
          make $MAKE_ARGS -j$(nproc --all) 2> >(tee build.err.log >&2) | tee build.log
          MAKE_RC=${PIPESTATUS[0]}
          echo "make exit code: $MAKE_RC"
          set -e

          # 验证构建结果
          if [ "$MAKE_RC" -eq 0 ] && [ -f "$KERNEL_SOURCE/out/arch/arm64/boot/Image" ]; then
              echo "✅ Kernel Build Successful (内核构建成功)"
          else
              echo "❌ Kernel build failure (内核构建失败)"
              echo "=========== compiler / linker diagnostics (build.err.log) ==========="
              if [ -s build.err.log ]; then
                grep -nE 'error:|Error [0-9]+|undefined reference|No rule to make target|fatal error' build.err.log | tail -60 || true
                echo "----------------- last 60 stderr lines -----------------"
                tail -n 60 build.err.log
              else
                echo "(build.err.log empty - falling back to build.log)"
                tail -n 100 build.log
              fi
              exit 1
          fi
            
          # 显示 ccache 统计信息
          echo "📊 CCache Statistics (CCache 统计信息):"
          ccache --show-stats

      - name: 🛠️ KPM Patching Image Files (KPM 修补 Image 文件)
        run: |
          KSU_VARIANT="${{ github.event.inputs.kernelsu_variant }}"
          KPM_ENABLE="${{ github.event.inputs.kpm_enable }}"
          
          if [ "$KSU_VARIANT" == "SukiSU-Ultra" ] && [ "$KPM_ENABLE" == "enable" ]; then
            echo "🛠️ 正在修补 Image 文件..."
            cd "$KERNEL_SOURCE/out/arch/arm64/boot"
            curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux" -o patch
            chmod 777 patch
            ./patch
            if [ $? -eq 0 ]; then
              rm -f Image
              mv oImage Image
              echo "✅ Image file repair complete (Image 文件修补完成)"
            else
              echo "❌ KPM Patch Failed, Use Original Image (KPM 修补失败，使用原始 Image)"
            fi
          else 
            echo "ℹ️ KPM is not enabled or KernelSU variants do not support KPM. (KPM 未启用或 KernelSU 变体不支持 KPM)"
          fi

      - name: 📝 Setting Version Variables (设置版本变量)
        run: |
          cd "$KERNEL_SOURCE"
          
          # 获取 Git Commit 哈希值
          GIT_COMMIT_SHORT=$(git rev-parse --short=6 HEAD)
          echo "GIT_COMMIT_ID=$GIT_COMMIT_SHORT" >> $GITHUB_ENV
          
          # 获取日期
          BUILD_DATE=$(date +%Y%m%d)
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV

      - name: 📦 Package kernel to AnyKernel3 (打包内核到 AnyKernel3)
        run: |
          # 定义变量
          SYSTEM="${{ github.event.inputs.compiled_system }}"
          KSU="${{ github.event.inputs.kernelsu_variant }}"
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          BUILD_ID="${{ env.GIT_COMMIT_ID }}"
          BUILD_DATE="${{ env.BUILD_DATE }}"
          ZIP_NAME="${DEVICE}_${KSU}_${SYSTEM}_${BUILD_DATE}_${BUILD_ID}_${BUILD_TYPE}.zip"
          
          echo "📦 Create AnyKernel3 package (创建 AnyKernel3 刷机包)"
          
          # 创建目录并克隆 AnyKernel3
          mkdir -p "$WORKDIR/ak3_out"
          cd "$WORKDIR/ak3_out"
          git clone https://github.com/liyafe1997/AnyKernel3.git --depth=1
          cd AnyKernel3
          
          # 删除不需要的文件
          rm -rf .git .github README.md
          
          # 复制内核镜像
          cp "$KERNEL_SOURCE/out/arch/arm64/boot/Image" ./
          
          # 打包
          echo "📦 Flashing package being created (正在创建刷机包): $ZIP_NAME"
          zip -r "$ZIP_NAME" .
          
          if [ -f "$ZIP_NAME" ]; then
            echo "✅ Flip package created successfully (刷机包创建成功): $ZIP_NAME"
            ls -lh "$ZIP_NAME"
            mv "$ZIP_NAME" ..
          else
            echo "❌ Brush package creation failed (刷机包创建失败)"
            exit 1
          fi
          
      - name: 📤 Upload compilation results (上传编译结果)
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-${{ matrix.device }}
          path: ${{ github.workspace }}/ak3_out/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: 📥 Download all zip artifacts (下载所有 zip 构建产物)
      uses: actions/download-artifact@v4
      with:
        path: out

    - name: 📝 Preparing files for release (准备发布文件)
      run: |
        mkdir -p release
        cd /home/runner/work/kernel_xiaomi_sm8250_mod/kernel_xiaomi_sm8250_mod/out
        device_list=()
        for dir in */; do
          device_name=$(echo "$dir" | sed 's/Kernel-//' | sed 's/\/$//')
          echo "Found device: $device_name"
          device_list+=("$device_name")
          cd "$dir"
        for zip_file in *; do
          if [[ -f "$zip_file" && "$zip_file" == *.zip ]]; then
          mv "$zip_file" /home/runner/work/kernel_xiaomi_sm8250_mod/kernel_xiaomi_sm8250_mod/release
        fi
          done
          cd ..
        done
        TARGET_DEVICES=$(echo "${device_list[*]}" | tr ' ' '-')
        echo "TARGET_DEVICES=$TARGET_DEVICES" >> $GITHUB_ENV

    - name: 📅 Setting date variables (设置日期变量)
      run: |
        echo "RELEASE_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
        REPO_URL="https://github.com/yspbwx2010/kernel_xiaomi_sm8250_mod.git"
        GIT_COMMIT_ID=$(git ls-remote $REPO_URL HEAD | cut -f1)
        echo "GIT_COMMIT_ID=$GIT_COMMIT_ID" >> $GITHUB_ENV
          
    - name: 📤 Post to Release (发布到 Release)
      uses: softprops/action-gh-release@v1
      with:
        files: /home/runner/work/kernel_xiaomi_sm8250_mod/kernel_xiaomi_sm8250_mod/release/*.zip
        name: Kernel_（${{ env.TARGET_DEVICES }}）_${{ github.event.inputs.kernelsu_variant }}_${{ github.event.inputs.compiled_system }}_${{ env.RELEASE_DATE }}_${{ env.GIT_COMMIT_ID }}_${{ github.event.inputs.build_type }}
        tag_name: Kernel_（${{ env.TARGET_DEVICES }}）_${{ github.event.inputs.kernelsu_variant }}_${{ github.event.inputs.compiled_system }}_${{ env.RELEASE_DATE }}_${{ env.GIT_COMMIT_ID }}
        body: |
          ## 📱kernel build information | 内核构建信息
      
          ### 🌐 英文 | English
          - **Target Device:** ${{ env.TARGET_DEVICES }}
          - **Compiled System:** ${{ github.event.inputs.compiled_system }}
          - **KernelSU Variant:** ${{ github.event.inputs.kernelsu_variant }}
          - **KPM Support:** ${{ github.event.inputs.kpm_enable }}
          - **Build Type:** ${{ github.event.inputs.build_type }}
          - **Build Date:** ${{ env.RELEASE_DATE }}
          - **Commit ID:** ${{ env.GIT_COMMIT_ID }}
      
          ### 🇨🇳 中文 | Chinese
          - **目标机型:** ${{ env.TARGET_DEVICES }}
          - **适用系统:** ${{ github.event.inputs.compiled_system }}
          - **KernelSU变体:** ${{ github.event.inputs.kernelsu_variant }}
          - **KPM支持:** ${{ github.event.inputs.kpm_enable }}
          - **构建类型:** ${{ github.event.inputs.build_type }}
          - **构建日期:** ${{ env.RELEASE_DATE }}
          - **提交ID:** ${{ env.GIT_COMMIT_ID }}
      
          ### 📋 安装说明 | Installation Guide
          1. 下载对应机型的刷机包
          2. 进入Recovery模式
          3. 通过Recovery刷入刷机包
          4. 重启设备
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
